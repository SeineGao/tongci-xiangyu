<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>同词相遇 · 在线联机</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #fff6f0;
    --card: #ffffff;
    --ink: #2a1f1a;
    --muted: #8a7268;
    --accent: #e85d4c;
    --accent2: #f4a261;
    --soft: #ffd6c8;
    --line: #f0ddd4;
    --ok: #2a9d8f;
    --shadow: 0 12px 40px rgba(232, 93, 76, 0.12);
    --radius: 22px;
    --font: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, #ffd8c8 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #ffe9c8 0%, transparent 50%),
      var(--bg);
    min-height: 100%;
  }
  .wrap {
    width: min(440px, 100%);
    margin: 0 auto;
    padding: 28px 20px 48px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }
  .brand { text-align: center; }
  .brand .mark {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; letter-spacing: 0.12em; color: var(--accent); font-weight: 600;
  }
  .brand .mark::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 4px rgba(232,93,76,.15);
  }
  h1 {
    font-size: clamp(26px, 6.5vw, 34px);
    line-height: 1.25; margin: 14px 0 10px; font-weight: 700; text-align: center;
  }
  .sub {
    color: var(--muted); font-size: 15px; line-height: 1.65;
    margin: 0 auto 24px; max-width: 34em; text-align: center;
  }
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.8);
    padding: 22px 20px;
  }
  .section-title { font-size: 16px; font-weight: 650; margin: 0 0 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    appearance: none; border: none; border-radius: 999px;
    padding: 13px 20px; font: inherit; font-weight: 650; font-size: 15px;
    cursor: pointer; transition: transform .12s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #ff7a59);
    color: #fff; box-shadow: 0 8px 20px rgba(232,93,76,.28); flex: 1; min-width: 120px;
  }
  .btn-ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .field {
    width: 100%; border: 1.5px solid var(--line); border-radius: 16px;
    padding: 14px 16px; font: inherit; font-size: 16px; outline: none; background: #fffaf7;
  }
  .field:focus { border-color: var(--accent2); }
  .field.big { font-size: 28px; text-align: center; letter-spacing: 0.28em; font-weight: 750; text-transform: uppercase; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 18px; }
  .chip {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 8px 14px; font-size: 13px; color: var(--muted); cursor: pointer;
  }
  .chip.on { background: #fff0ea; border-color: var(--accent); color: var(--accent); font-weight: 650; }
  .hint { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 12px; }
  .screen { display: none; animation: rise .35s ease; }
  .screen.on { display: block; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  .round-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff0ea; color: var(--accent); border-radius: 999px;
    padding: 6px 12px; font-size: 13px; font-weight: 650;
  }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent2); }
  .timer.warn { color: var(--accent); }
  .status-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .code-box {
    text-align: center; background: #fffaf7; border: 1px dashed var(--accent2);
    border-radius: 18px; padding: 18px; margin: 8px 0 14px;
  }
  .code-box .code {
    font-size: 34px; font-weight: 800; letter-spacing: 0.35em; color: var(--accent);
    margin: 6px 0 4px; padding-left: 0.35em;
  }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #ccc; margin-right: 6px;
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(42,157,143,.15); }
  .waiting {
    text-align: center; color: var(--muted); font-size: 14px; padding: 8px 0 4px;
  }
  .reveal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
  .reveal-card {
    background: linear-gradient(180deg, #fff, #fff8f4); border: 1px solid var(--line);
    border-radius: 18px; padding: 18px 12px; text-align: center;
  }
  .reveal-card .who { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .reveal-card .word { font-size: 22px; font-weight: 750; word-break: break-word; }
  .history { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .hist-item {
    display: grid; grid-template-columns: 48px 1fr 1fr; gap: 8px; align-items: center;
    background: #fffaf7; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 14px;
  }
  .hist-item .n { color: var(--muted); font-weight: 650; }
  .hist-item .w { text-align: center; font-weight: 650; padding: 6px 8px; border-radius: 10px; background: #fff; }
  .win { text-align: center; padding: 12px 0 8px; }
  .win .emoji { font-size: 42px; margin-bottom: 8px; }
  .win h2 { margin: 0 0 8px; font-size: 26px; }
  .footer { text-align: center; margin-top: auto; padding-top: 28px; font-size: 12px; color: #b39a90; }
  .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: rgba(42,31,26,.92); color: #fff; padding: 10px 16px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9;
  }
  .toast.on { opacity: 1; }
  .err { color: var(--accent); font-size: 13px; margin-top: 8px; min-height: 1.2em; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="home" class="screen on">
      <div class="brand"><span class="mark">同词相遇 · 联机</span></div>
      <h1>你们会在第几轮<br/>想到同一个词？</h1>
      <p class="sub">创建房间发给朋友，各自输入、同时揭晓；没撞上就继续联想，直到相遇。</p>
      <div class="card">
        <div class="section-title">创建房间</div>
        <div class="label">你的昵称</div>
        <input class="field" id="hostName" value="房主" maxlength="8" />
        <div class="label" style="margin-top:12px">每轮思考时间</div>
        <div class="chips" id="timeChips">
          <button type="button" class="chip on" data-sec="30">30 秒</button>
          <button type="button" class="chip" data-sec="60">60 秒</button>
          <button type="button" class="chip" data-sec="0">不限时</button>
        </div>
        <div class="row">
          <button class="btn btn-primary" id="btnCreate">创建并生成房间码</button>
        </div>
        <div class="err" id="createErr"></div>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="section-title">加入房间</div>
        <div class="label">你的昵称</div>
        <input class="field" id="joinName" value="好友" maxlength="8" />
        <div class="label" style="margin-top:12px">房间码</div>
        <input class="field big" id="joinCode" maxlength="6" placeholder="ABC123" />
        <div class="row" style="margin-top:14px">
          <button class="btn btn-primary" id="btnJoin">加入</button>
        </div>
        <div class="err" id="joinErr"></div>
        <p class="hint">朋友把房间码或链接发给你，填码即可同时在线玩。</p>
      </div>
    </div>

    <div id="lobby" class="screen">
      <div class="brand"><span class="mark">等待好友</span></div>
      <h1>房间已创建</h1>
      <div class="card">
        <div class="code-box">
          <div class="label">房间码</div>
          <div class="code" id="roomCode">------</div>
          <div class="waiting"><span class="dot" id="peerDot"></span><span id="lobbyStatus">正在连接服务器…</span></div>
        </div>
        <div class="row">
          <button class="btn btn-primary" id="btnCopyLink">复制邀请链接</button>
          <button class="btn btn-ghost" id="btnCopyCode">复制房间码</button>
        </div>
        <p class="hint" id="lobbyHint">好友打开同一网页，输入房间码即可加入。两人都到齐后自动开局。</p>
        <div class="row" style="margin-top:12px">
          <button class="btn btn-ghost" id="btnCancelLobby" style="flex:1">取消</button>
        </div>
      </div>
    </div>

    <div id="play" class="screen">
      <div class="status-line">
        <span class="round-pill">第 <span id="roundNo">1</span> 轮</span>
        <span class="timer" id="timer">—</span>
      </div>
      <h1 style="font-size:22px;margin:0 0 6px" id="playTitle">想一个词</h1>
      <p class="sub" style="text-align:left;margin:0 0 12px" id="playHint"></p>
      <div class="card">
        <input class="field" id="wordInput" maxlength="20" placeholder="输入一个词（对方看不到）" autocomplete="off" />
        <div class="row" style="margin-top:14px">
          <button class="btn btn-primary" id="btnSubmit" disabled>提交</button>
        </div>
        <p class="waiting" id="waitOther" style="display:none">已提交，等待对方…</p>
        <div class="history" id="history"></div>
      </div>
    </div>

    <div id="reveal" class="screen">
      <div class="status-line">
        <span class="round-pill">第 <span id="revealRound">1</span> 轮揭晓</span>
      </div>
      <h1 style="font-size:22px;margin:0 0 4px" id="revealTitle">本轮结果</h1>
      <div class="reveal-grid">
        <div class="reveal-card">
          <div class="who" id="whoA">A</div>
          <div class="word" id="wordA">—</div>
        </div>
        <div class="reveal-card">
          <div class="who" id="whoB">B</div>
          <div class="word" id="wordB">—</div>
        </div>
      </div>
      <div class="card" style="text-align:center">
        <p id="revealMsg" style="margin:0 0 16px;color:var(--muted);line-height:1.6"></p>
        <button class="btn btn-primary" id="btnNext" style="width:100%">下一轮</button>
      </div>
      <div class="history" id="historyReveal"></div>
    </div>

    <div id="win" class="screen">
      <div class="card win">
        <div class="emoji">✨</div>
        <h2>同词相遇！</h2>
        <div style="color:var(--muted);margin-bottom:18px">你们在第 <strong id="winRounds">1</strong> 轮想到了同一个词</div>
        <div class="reveal-card" style="margin:0 auto 18px;max-width:240px">
          <div class="who">相遇之词</div>
          <div class="word" id="winWord">—</div>
        </div>
        <div class="row" style="justify-content:center">
          <button class="btn btn-primary" id="btnAgain">再来一局</button>
          <button class="btn btn-ghost" id="btnHome">回首页</button>
        </div>
      </div>
      <div class="history" id="historyWin"></div>
    </div>

    <div class="footer">在线联机 · PeerJS 点对点</div>
  </div>
  <div class="toast" id="toast"></div>

<script>
(() => {
  const PREFIX = "xiangyu-";
  const $ = (id) => document.getElementById(id);
  const screens = ["home", "lobby", "play", "reveal", "win"];

  const S = {
    role: null, // host | guest
    code: "",
    seconds: 30,
    myName: "",
    peerName: "",
    peer: null,
    conn: null,
    round: 1,
    myWord: "",
    peerWord: "",
    mySubmitted: false,
    peerSubmitted: false,
    history: [],
    timerId: null,
    left: 0,
    nextReady: { me: false, peer: false },
    gamePhase: "lobby", // lobby | play | reveal | win
  };

  function show(id) {
    screens.forEach((s) => $(s).classList.toggle("on", s === id));
  }
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("on");
    setTimeout(() => t.classList.remove("on"), 1800);
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function normalize(w) {
    return (w || "").trim().toLowerCase().replace(/\s+/g, "");
  }
  function randCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let s = "";
    for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }
  function shareUrl(code) {
    const u = new URL(location.href);
    u.searchParams.set("room", code);
    return u.toString();
  }
  function renderHistory(el) {
    el.innerHTML = S.history.map((h) =>
      `<div class="hist-item"><div class="n">#${h.round}</div><div class="w">${escapeHtml(h.a)}</div><div class="w">${escapeHtml(h.b)}</div></div>`
    ).join("");
  }
  function send(msg) {
    if (S.conn && S.conn.open) S.conn.send(msg);
  }
  function destroyPeer() {
    stopTimer();
    try { if (S.conn) S.conn.close(); } catch (_) {}
    try { if (S.peer) S.peer.destroy(); } catch (_) {}
    S.conn = null;
    S.peer = null;
  }

  // —— timer ——
  function stopTimer() {
    if (S.timerId) clearInterval(S.timerId);
    S.timerId = null;
  }
  function startTimer() {
    stopTimer();
    const el = $("timer");
    if (!S.seconds) { el.textContent = "不限时"; el.classList.remove("warn"); return; }
    S.left = S.seconds;
    el.textContent = S.left + "s";
    el.classList.toggle("warn", S.left <= 10);
    S.timerId = setInterval(() => {
      S.left -= 1;
      el.textContent = Math.max(0, S.left) + "s";
      el.classList.toggle("warn", S.left <= 10);
      if (S.left <= 0) { stopTimer(); el.textContent = "时间到"; }
    }, 1000);
  }

  // —— chips ——
  $("timeChips").addEventListener("click", (e) => {
    const t = e.target.closest(".chip");
    if (!t) return;
    [...$("timeChips").children].forEach((c) => c.classList.remove("on"));
    t.classList.add("on");
    S.seconds = Number(t.dataset.sec);
  });

  function wireConn(conn) {
    S.conn = conn;
    conn.on("data", onData);
    conn.on("close", () => {
      toast("对方已断开");
      $("lobbyStatus").textContent = "对方断开，可重新创建房间";
      $("peerDot").classList.remove("on");
    });
    conn.on("error", () => toast("连接出错"));
  }

  function onData(msg) {
    if (!msg || !msg.type) return;
    switch (msg.type) {
      case "hello":
        S.peerName = msg.name || "好友";
        if (S.role === "host") {
          send({ type: "welcome", name: S.myName, seconds: S.seconds, code: S.code });
          beginGame();
        }
        break;
      case "welcome":
        S.peerName = msg.name || "房主";
        S.seconds = msg.seconds ?? S.seconds;
        S.code = msg.code || S.code;
        beginGame();
        break;
      case "submit":
        S.peerWord = msg.word || "";
        S.peerSubmitted = true;
        tryReveal();
        break;
      case "reveal":
        applyReveal(msg.a, msg.b, msg.round, msg.history);
        break;
      case "next":
        S.nextReady.peer = true;
        maybeNext();
        break;
      case "restart":
        resetRoundState(true);
        beginPlayUI();
        break;
      case "ping":
        send({ type: "pong" });
        break;
    }
  }

  function beginGame() {
    S.gamePhase = "play";
    S.round = 1;
    S.history = [];
    resetRoundState(false);
    beginPlayUI();
    toast(S.peerName + " 已加入，开局！");
  }

  function resetRoundState(keepHistory) {
    S.myWord = "";
    S.peerWord = "";
    S.mySubmitted = false;
    S.peerSubmitted = false;
    S.nextReady = { me: false, peer: false };
    if (!keepHistory) S.history = [];
  }

  function beginPlayUI() {
    $("roundNo").textContent = String(S.round);
    if (S.round === 1) {
      $("playTitle").textContent = "第一轮 · 随便想一个词";
      $("playHint").textContent = "对方看不到你输入的内容。提交后等双方都齐了再揭晓。";
    } else {
      const last = S.history[S.history.length - 1];
      $("playTitle").textContent = "继续联想";
      $("playHint").textContent = last
        ? `想一个能同时关联「${last.a}」和「${last.b}」的词。`
        : "根据上一轮的两个词继续联想。";
    }
    $("wordInput").value = "";
    $("wordInput").disabled = false;
    $("btnSubmit").disabled = true;
    $("btnSubmit").style.display = "";
    $("waitOther").style.display = "none";
    renderHistory($("history"));
    show("play");
    startTimer();
  }

  function tryReveal() {
    if (!(S.mySubmitted && S.peerSubmitted)) {
      if (S.mySubmitted) $("waitOther").style.display = "block";
      return;
    }
    // Host authoritative ordering: host word as A, guest as B
    let a, b, nameA, nameB;
    if (S.role === "host") {
      a = S.myWord; b = S.peerWord;
      nameA = S.myName; nameB = S.peerName;
      send({ type: "reveal", a, b, round: S.round, history: S.history.concat([{ round: S.round, a, b }]), nameA, nameB });
      applyReveal(a, b, S.round, S.history.concat([{ round: S.round, a, b }]), nameA, nameB);
    }
    // guest waits for host reveal message
  }

  function applyReveal(a, b, round, history, nameA, nameB) {
    stopTimer();
    S.round = round;
    S.history = history || S.history;
    // ensure current round in history
    if (!S.history.some((h) => h.round === round)) {
      S.history = S.history.concat([{ round, a, b }]);
    }
    const nA = nameA || (S.role === "host" ? S.myName : S.peerName);
    const nB = nameB || (S.role === "host" ? S.peerName : S.myName);
    // For guest display: host is always left (A), guest right (B) — matches host send
    $("whoA").textContent = S.role === "host" ? S.myName : S.peerName;
    $("whoB").textContent = S.role === "host" ? S.peerName : S.myName;
    if (S.role === "guest") {
      // host sent a=host word, b=guest word
      $("whoA").textContent = S.peerName;
      $("whoB").textContent = S.myName;
    }
    $("wordA").textContent = a;
    $("wordB").textContent = b;
    $("revealRound").textContent = String(round);
    renderHistory($("historyReveal"));
    S.gamePhase = "reveal";
    S.nextReady = { me: false, peer: false };

    if (normalize(a) === normalize(b)) {
      $("revealTitle").textContent = "撞上了！";
      $("revealMsg").textContent = "同一轮想到了同一个词。";
      $("btnNext").textContent = "查看相遇结果";
      $("btnNext").onclick = () => showWin(a, round);
      show("reveal");
      return;
    }
    $("revealTitle").textContent = "还没相遇";
    $("revealMsg").textContent = "下一轮请共同联想一个能同时关联这两个词的新词。双方点「下一轮」后继续。";
    $("btnNext").textContent = "下一轮 · 继续联想";
    $("btnNext").onclick = () => {
      S.nextReady.me = true;
      $("btnNext").disabled = true;
      $("btnNext").textContent = "等待对方…";
      send({ type: "next" });
      maybeNext();
    };
    $("btnNext").disabled = false;
    show("reveal");
  }

  function maybeNext() {
    if (!(S.nextReady.me && S.nextReady.peer)) return;
    S.round += 1;
    resetRoundState(true);
    beginPlayUI();
  }

  function showWin(word, round) {
    stopTimer();
    S.gamePhase = "win";
    $("winRounds").textContent = String(round);
    $("winWord").textContent = word;
    renderHistory($("historyWin"));
    show("win");
  }

  // —— create room ——
  $("btnCreate").addEventListener("click", () => {
    $("createErr").textContent = "";
    destroyPeer();
    S.role = "host";
    S.myName = ($("hostName").value.trim() || "房主").slice(0, 8);
    S.code = randCode();
    $("roomCode").textContent = S.code;
    $("lobbyStatus").textContent = "正在连接服务器…";
    $("peerDot").classList.remove("on");
    show("lobby");

    const peer = new Peer(PREFIX + S.code, { debug: 1 });
    S.peer = peer;
    peer.on("open", () => {
      $("lobbyStatus").textContent = "等待好友加入…";
      $("peerDot").classList.add("on");
    });
    peer.on("connection", (conn) => {
      wireConn(conn);
      conn.on("open", () => {
        $("lobbyStatus").textContent = "好友正在进入…";
      });
    });
    peer.on("error", (err) => {
      const m = String(err && err.type || err);
      if (m.includes("unavailable-id") || m === "unavailable-id") {
        S.code = randCode();
        $("roomCode").textContent = S.code;
        $("createErr").textContent = "房间码冲突，已换码，请重试创建。";
        show("home");
        destroyPeer();
      } else {
        $("lobbyStatus").textContent = "连接失败：" + m;
        $("createErr").textContent = "创建失败，请刷新重试。";
      }
    });
  });

  $("btnCopyCode").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(S.code);
      toast("房间码已复制");
    } catch (_) {
      toast(S.code);
    }
  });
  $("btnCopyLink").addEventListener("click", async () => {
    const link = shareUrl(S.code);
    try {
      await navigator.clipboard.writeText(link);
      toast("邀请链接已复制");
    } catch (_) {
      prompt("复制链接", link);
    }
  });
  $("btnCancelLobby").addEventListener("click", () => {
    destroyPeer();
    show("home");
  });

  // —— join ——
  $("btnJoin").addEventListener("click", () => joinRoom(($("joinCode").value || "").trim().toUpperCase()));

  function joinRoom(code) {
    $("joinErr").textContent = "";
    code = code.replace(/[^A-Z0-9]/gi, "").toUpperCase().slice(0, 6);
    if (code.length < 4) {
      $("joinErr").textContent = "请输入有效房间码";
      return;
    }
    destroyPeer();
    S.role = "guest";
    S.code = code;
    S.myName = ($("joinName").value.trim() || "好友").slice(0, 8);
    $("joinCode").value = code;
    $("lobbyStatus").textContent = "正在加入 " + code + "…";
    $("roomCode").textContent = code;
    $("peerDot").classList.remove("on");
    show("lobby");
    $("lobbyHint").textContent = "正在连接房主，请稍候…";

    const peer = new Peer({ debug: 1 });
    S.peer = peer;
    peer.on("open", () => {
      const conn = peer.connect(PREFIX + code, { reliable: true });
      wireConn(conn);
      conn.on("open", () => {
        $("peerDot").classList.add("on");
        $("lobbyStatus").textContent = "已连接，同步中…";
        send({ type: "hello", name: S.myName });
      });
    });
    peer.on("error", (err) => {
      $("joinErr").textContent = "加入失败：" + (err && err.type || err);
      show("home");
      destroyPeer();
    });
    // timeout
    setTimeout(() => {
      if (S.gamePhase === "lobby" && S.role === "guest" && !S.mySubmitted) {
        if (!$("play").classList.contains("on") && $("lobby").classList.contains("on")) {
          // still in lobby after 12s
        }
      }
    }, 12000);
  }

  // —— play submit ——
  $("wordInput").addEventListener("input", () => {
    $("btnSubmit").disabled = !$("wordInput").value.trim() || S.mySubmitted;
  });
  $("wordInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !$("btnSubmit").disabled) $("btnSubmit").click();
  });
  $("btnSubmit").addEventListener("click", () => {
    const w = $("wordInput").value.trim();
    if (!w || S.mySubmitted) return;
    stopTimer();
    S.myWord = w;
    S.mySubmitted = true;
    $("wordInput").disabled = true;
    $("btnSubmit").disabled = true;
    $("waitOther").style.display = "block";
    send({ type: "submit", word: w });
    tryReveal();
  });

  $("btnAgain").addEventListener("click", () => {
    send({ type: "restart" });
    S.round = 1;
    resetRoundState(false);
    beginPlayUI();
  });
  $("btnHome").addEventListener("click", () => {
    destroyPeer();
    S.gamePhase = "lobby";
    show("home");
  });

  // auto-join from ?room=
  const params = new URLSearchParams(location.search);
  const room = (params.get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (room) {
    $("joinCode").value = room;
    // don't auto-join immediately — let user set name, but prefill
    toast("已填入房间码，改好昵称后点加入");
  }
})();
</script>
</body>
</html>
